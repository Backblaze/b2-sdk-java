name: b2-sdk-java Maven Central deployment
on:
  push:
    tags: ['v*']

jobs:
  deploy:
    name: Deploy
    if: github.repository == 'Backblaze/b2-sdk-java'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Deploy to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository createBundle --no-daemon --stacktrace
        env:
          RELEASE_BUILD: true
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}

      - name: Get tag name
        id: get_tag
        shell: bash
        run: |
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v2 # actions-governance: replaced by gh release create/upload; remove after a real run verifies it
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: ${{ steps.get_tag.outputs.tag }}
      #     name: ${{ steps.get_tag.outputs.tag }}
      #     prerelease: false
      #     draft: false
      #     files: |
      #       core/build/libs/bundle-*.jar
      #       httpclient/build/libs/bundle-*.jar
      #       samples/build/libs/bundle-*.jar
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            core/build/libs/bundle-*.jar
            httpclient/build/libs/bundle-*.jar
            samples/build/libs/bundle-*.jar
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --draft=false --prerelease=false
            if (( ${#assets[@]} )); then
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          else
            create_args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes '' --draft=false --prerelease=false)
            if (( ${#assets[@]} )); then
              create_args+=("${assets[@]}")
            fi
            gh release create "$TAG" "${create_args[@]}"
          fi
